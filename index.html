<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- link trang -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.js">
    <title>Đổi tiền tệ Hòa</title>
</head>

<body id="tong">

    <div class="container ">
        <h1 class="text-center">Đổi tiền Hòa </h1>

        <div class="mb-3">
            <label class="form-label">Số tiền đổi</label>
            <input id="nhapTien" class="form-control" type="number">
        </div>
        <!-- Mệnh giá chuyển tiền -->
        <div class="row">
            <div class="col-6">
                <label class="form-label"> Từ </label>
                <select id="tu" class="form-select" name="tu">
                    <option value="VND">VND</option>
                    <option value="USD">USD</option>
                </select>
            </div>
            <div class="col-6">
                <label class="form-label"> Sang </label>
                <select id="sang" class="form-select" name="sang">
                    <option value="USD">USD</option>
                    <option value="VND">VND</option>
                </select>
            </div>
        </div>
        <!-- Nút chuyển đổi -->
        <div class="text-center mt-4 ">
            <button id="chuyenDoi" class="btn btn-primary"> Chuyển đổi </button>
        </div>
        
        <div id="xuatTien" class="text-danger text-center mt-4"> Thành tiền: </div>
    </div>
</body>

</html>
